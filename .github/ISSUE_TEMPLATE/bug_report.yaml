# Generated by aurora@aurora-smart-home (ha-integration-dev skill)
# https://github.com/tonylofgren/aurora-smart-home

name: Bug report
description: Report a reproducible FlightSeats integration problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not post API keys, authorization headers, or private travel plans. Review logs and diagnostics before attaching them."
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: FlightSeats integration version
      placeholder: "0.1.3"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - HACS custom repository
        - Manual
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include relevant watch settings with personal details removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or diagnostics
      description: Optional. Remove secrets and private route/date details before posting.
      render: text
