# Generated by aurora@aurora-smart-home (ha-integration-dev skill)
# https://github.com/tonylofgren/aurora-smart-home

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check tag, manifest and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_notes.py

  tests:
    needs: version
    uses: ./.github/workflows/tests.yaml

  validate:
    needs: version
    uses: ./.github/workflows/validate.yaml

  publish:
    name: Publish GitHub release
    needs: [tests, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_notes.py
      - name: Publish checked tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "FlightSeats.io $RELEASE_TAG" --notes-file release-notes.md
          fi
