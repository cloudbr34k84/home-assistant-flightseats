# https://github.com/tonylofgren/aurora-smart-home

name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_dev.txt

      - name: Lint and formatting
        run: |
          ruff check custom_components tests .github/scripts/check_coverage.py
          ruff format --check custom_components tests .github/scripts/check_coverage.py

      - name: Strict typing
        run: python -m mypy

      - name: Run tests
        run: |
          python -m coverage run --branch -m pytest tests/ -v --tb=short --junitxml=test-results/pytest.xml
          python -m coverage report --show-missing
          python -m coverage json -o test-results/coverage.json
          python .github/scripts/check_coverage.py test-results/coverage.json

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  minimum-version:
    name: Home Assistant 2026.8 minimum
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test_minimum.txt

      - name: Install minimum-version test dependencies
        run: python -m pip install -r requirements_test_minimum.txt

      - name: Run complete suite on the minimum version
        run: python -m pytest tests/ -q
