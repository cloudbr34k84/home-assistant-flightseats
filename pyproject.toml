[tool.pytest.ini_options]
# respx imports legacy httpx before Home Assistant can install its httpx2 alias.
addopts = "-p no:respx"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/ha_flightseats"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/ha_flightseats"]
strict = true
follow_imports = "silent"
show_error_codes = true
